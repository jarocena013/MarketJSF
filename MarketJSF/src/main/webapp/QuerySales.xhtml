<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Query Rides</title>
</h:head>
<h:body>
	<h:form id="nireForm">
		<h3>Sale bilatzailea</h3>
		<h:messages id="mezuak" styleClass="info-msg" globalOnly="true" />

		<table>
			<tr>
				<td>Sale izena:</td>
				<td><h:inputText id="salename" value="#{querySale.izena}">
					</h:inputText></td>
				<td><h:message for="salename" style="color:red" /></td>
			</tr>
		</table>

		<p>
			<h:commandButton value="Bilatu" action="#{querySale.searchSales()}" />
			<h:commandButton value="Itxi" action="Sarrera.xhtml"
				immediate="true" onclick="if (!confirm('Ziur zaude?')) return false" />
		</p>

		<p:dataTable id="saletaula" value="#{querySale.results}" var="item"
    selectionMode="single" selection="#{querySale.sale}" border="1"
    rowKey="#{item.saleNumber}">
    
    <f:facet name="header">Izen horrekin aurkitutako Saleak:</f:facet>
    
    <p:column headerText="Izena">#{item.title}</p:column>
    <p:column headerText="Deskripzioa">#{item.description}</p:column>
    <p:column headerText="Prezioa">#{item.price}</p:column>
    <p:column headerText="Seller izena">#{item.seller.name}</p:column>
    
    <p:column headerText="Ekintzak">
        <p:commandButton value="Ikusi xehetasunak" 
                         action="#{querySale.xehetasunakIkusi()}" 
                         update="@form">
            <f:setPropertyActionListener value="#{item}" target="#{querySale.sale}" />
        </p:commandButton>
    </p:column>
</p:dataTable>
	</h:form>
</h:body>
</html>
