<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<title>Sale Xehetasunak</title>
</h:head>
<h:body>
	<h:form>
		<h3>Salearen Xehetasunak</h3>

		<h:panelGrid columns="2" border="1" cellpadding="5">
			<h:outputText value="Izena:" style="font-weight:bold;" />
			<h:outputText value="#{querySale.sale.title}" />

			<h:outputText value="Deskripzioa:" style="font-weight:bold;" />
			<h:outputText value="#{querySale.sale.description}" />

			<h:outputText value="Prezioa:" style="font-weight:bold;" />
			<h:outputText value="#{querySale.sale.price}" />

			<h:outputText value="Egoera " style="font-weight:bold;" />
			<h:outputText value="#{querySale.sale.status}" />

			<h:outputText value="Seller izena:" style="font-weight:bold;" />
			<h:outputText value="#{querySale.sale.seller.name}" />

			<!-- IRUDIA ERAKUSTEKO ZUTABEA -->
			<h:outputText value="Irudia:" style="font-weight:bold;" />
			<h:graphicImage value="/resources/images/kamiseta.jpg"
				width="200" alt="Irudirik ez" />

		</h:panelGrid>

		<p>
			<h:commandButton value="Close" action="QuerySales.xhtml"
				immediate="true" onclick="if (!confirm('Ziur zaude?')) return false" />
		</p>
	</h:form>
</h:body>
</html>
